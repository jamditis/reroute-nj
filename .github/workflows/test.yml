name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node tests and data validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Node test suites
        run: |
          set -euo pipefail
          failed=0
          for t in tests/test-*.js; do
            echo "::group::$t"
            if ! node "$t"; then
              echo "::error file=$t::$t failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Validate data
        run: python3 tools/validate-data.py
